[project]
name = "noteiq"
description = "Copilot meeting insights in a Teams tab, without Azure Bot Service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "microsoft-teams-cards==2.0.16",
    "msal>=1.31,<2",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
    "pydantic>=2.13.5",
    "cryptography>=46,<47",
    "psycopg[binary,pool]>=3.2,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
